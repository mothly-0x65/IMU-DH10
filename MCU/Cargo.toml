[package]
name = "imu-embassy-project"
version = "0.1.0"
edition = "2024"

[dependencies]
# Upgrade this to 0.7.0
embassy-executor = { version = "0.7.0", features = ["task-arena-size-32768", "arch-cortex-m", "executor-thread", "defmt"] }

# Keep these at 0.6.0 / 0.4.0
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32h753zi", "time-driver-any", "memory-x", "unstable-pac", "exti"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-net = { version = "0.9.1", features = ["defmt", "udp", "medium-ethernet", "proto-ipv4"] }

cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1.1.0"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }
static_cell = "2"
heapless = "0.9.3"
lan8742 = { path = "../PHY/lan8742" }
ad7768 = { path = "../ADC"}
ad7768-pac = { path = "../ADC/ad7768-pac" }

[profile.release]
debug = 2
opt-level = "s"
lto = true
codegen-units = 1